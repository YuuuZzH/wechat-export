<!DOCTYPE html>
<html lang="zh-CN" data-theme="pixel">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>{% block title %}WeChat Export{% endblock %}</title>
<script>
(function () {
  try {
    var t = localStorage.getItem('wechat-export-theme') || 'pixel';
    if (!/^(pixel|youth|tech|anime|wechat|qq)$/.test(t)) t = 'pixel';
    document.documentElement.setAttribute('data-theme', t);
  } catch (e) {
    document.documentElement.setAttribute('data-theme', 'pixel');
  }
})();
</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700&family=Press+Start+2P&family=Rajdhani:wght@500;600;700&family=ZCOOL+KuaiLe&family=ZCOOL+QingKe+HuangYou&family=Zen+Maru+Gothic:wght@500;700&family=Noto+Sans+SC:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="{{ url_for('static', filename='css/app.css') }}">
<link rel="stylesheet" href="{{ url_for('static', filename='css/themes.css') }}">
{% block head %}{% endblock %}
</head>
<body>
<div class="pixel-bg" aria-hidden="true"></div>
<nav id="top-nav">
  <a href="/" class="nav-brand">
    <span class="nav-brand-mark">◆</span>
    <span class="nav-brand-text">WeChat Export</span>
  </a>
  <span class="nav-tagline">微信导出 · 分析与导出</span>
  <span class="nav-version" title="版本号">v{{ app_version }}</span>
  <div class="nav-right">
    <details class="theme-picker">
      <summary title="切换界面主题">主题</summary>
      <div class="theme-menu" role="listbox" aria-label="界面主题">
        <button type="button" role="option" data-theme-set="pixel">像素风</button>
        <button type="button" role="option" data-theme-set="youth">青春风</button>
        <button type="button" role="option" data-theme-set="tech">科技风</button>
        <button type="button" role="option" data-theme-set="anime">动漫风</button>
        <button type="button" role="option" data-theme-set="wechat">微信原始风</button>
        <button type="button" role="option" data-theme-set="qq">QQ 复古风</button>
      </div>
    </details>
    <a href="/docs" class="nav-manual" title="使用说明（README）">说明</a>
    {% block nav_right %}{% endblock %}
  </div>
</nav>
<main id="content">
{% block content %}{% endblock %}
</main>
<script src="{{ url_for('static', filename='js/theme.js') }}"></script>
{% block scripts %}{% endblock %}
</body>
</html>
