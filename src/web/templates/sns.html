{% extends "base.html" %}
{% block title %}朋友圈 — WeChat Export{% endblock %}
{% block content %}
<a href="/" class="back-link">← 返回仪表盘</a>
<h2 style="margin:0 0 4px 0">朋友圈（离线）</h2>
<p style="color:var(--px-muted);font-size:12px;margin:0 0 16px 0">只读浏览备份中的 sns.db；支持实况标记与 JSON/HTML 导出。不做删除拦截。</p>

<div class="config-panel">
  <div class="form-row">
    <div style="flex:2"><label>关键词</label><input id="cfg-q" placeholder="正文 / 链接 / wxid"></div>
    <div style="flex:2"><label>用户名过滤</label><input id="cfg-user" placeholder="wxid（可选）"></div>
    <div style="flex:1"><label>开始日期</label><input id="cfg-start" type="date"></div>
    <div style="flex:1"><label>结束日期</label><input id="cfg-end" type="date"></div>
  </div>
  <div class="form-row" style="margin-top:10px">
    <button type="button" id="btn-load" class="btn btn-primary">加载时间线</button>
    <button type="button" id="btn-export-html" class="btn btn-secondary">导出 HTML</button>
    <button type="button" id="btn-export-json" class="btn btn-secondary">导出 JSON</button>
    <span id="status" style="color:var(--px-muted);font-size:12px;margin-left:8px"></span>
  </div>
</div>

<div id="sns-list" style="margin-top:18px"></div>
{% endblock %}
{% block scripts %}
<style>
.sns-post {
  background: var(--px-panel);
  border: 2px solid var(--px-border);
  box-shadow: 2px 2px 0 var(--px-shadow);
  padding: 14px 16px;
  margin-bottom: 12px;
}
.sns-meta { color: var(--px-muted); font-size: 12px; margin-bottom: 8px; }
.sns-name { color: var(--px-text); font-weight: 600; }
.sns-live {
  display: inline-block; background: var(--px-pink, #e04570); color: #fff;
  font-size: 11px; padding: 1px 6px; margin-left: 6px;
}
.sns-content { white-space: pre-wrap; line-height: 1.55; font-size: 14px; color: var(--px-text); }
.sns-media { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 10px; }
.sns-media img, .sns-media video {
  max-width: 160px; max-height: 160px; object-fit: cover;
  border: 1px solid var(--px-border); background: #000;
}
.sns-empty { text-align: center; padding: 40px; color: var(--px-muted); }
</style>
<script>
(function () {
  const list = document.getElementById('sns-list');
  const status = document.getElementById('status');

  function esc(s) {
    const d = document.createElement('div');
    d.textContent = s == null ? '' : String(s);
    return d.innerHTML;
  }
  function fmtTime(ts) {
    if (!ts) return '未知时间';
    const d = new Date(ts * 1000);
    const p = n => String(n).padStart(2, '0');
    return d.getFullYear() + '-' + p(d.getMonth() + 1) + '-' + p(d.getDate())
      + ' ' + p(d.getHours()) + ':' + p(d.getMinutes());
  }
  function mediaUrl(m, video) {
    const params = new URLSearchParams();
    params.set('url', m.url || '');
    if (m.token) params.set('token', m.token);
    if (m.key) params.set('key', m.key);
    if (video) {
      params.set('url', m.live_video_url || m.url || '');
      if (m.live_video_token) params.set('token', m.live_video_token);
      if (m.live_video_key) params.set('key', m.live_video_key);
      params.set('video', '1');
    }
    return '/api/sns/media?' + params.toString();
  }

  function renderPosts(data) {
    const posts = (data && data.posts) || [];
    if (!data.ok) {
      list.innerHTML = '<div class="sns-empty">' + esc(data.error || '加载失败') + '</div>';
      return;
    }
    if (!posts.length) {
      list.innerHTML = '<div class="sns-empty">没有匹配的朋友圈动态</div>';
      return;
    }
    let html = '';
    for (const p of posts) {
      html += '<article class="sns-post">';
      html += '<div class="sns-meta"><span class="sns-name">' + esc(p.display_name || p.username || '') + '</span>'
        + (p.is_live_photo ? '<span class="sns-live">实况</span>' : '')
        + ' · ' + esc(fmtTime(p.create_time))
        + (p.tid != null ? ' · tid=' + esc(String(p.tid)) : '')
        + '</div>';
      html += '<div class="sns-content">' + esc(p.content || '[无文字]') + '</div>';
      const media = p.media || [];
      if (media.length) {
        html += '<div class="sns-media">';
        for (const m of media) {
          if (m.is_live_photo && m.live_video_url) {
            html += '<div><img src="' + esc(mediaUrl(m, false)) + '" loading="lazy" alt="实况静图" onerror="this.style.opacity=.3">'
              + '<video src="' + esc(mediaUrl(m, true)) + '" controls preload="metadata" style="display:block;margin-top:4px;max-width:220px"></video></div>';
          } else if ((m.type === '15' || (m.url || '').indexOf('snsvideodownload') >= 0)) {
            html += '<video src="' + esc(mediaUrl(Object.assign({}, m, {key: m.enc_key || m.key}), true)) + '" controls preload="metadata"></video>';
          } else {
            html += '<img src="' + esc(mediaUrl(m, false)) + '" loading="lazy" alt="" onerror="this.style.opacity=.3">';
          }
        }
        html += '</div>';
      }
      html += '</article>';
    }
    list.innerHTML = html;
    status.textContent = '共 ' + (data.total || posts.length) + ' 条';
  }

  function queryParams() {
    const p = new URLSearchParams();
    const q = document.getElementById('cfg-q').value.trim();
    const u = document.getElementById('cfg-user').value.trim();
    const s = document.getElementById('cfg-start').value;
    const e = document.getElementById('cfg-end').value;
    if (q) p.set('q', q);
    if (u) p.set('username', u);
    if (s) p.set('start', s);
    if (e) p.set('end', e);
    p.set('limit', '80');
    return p;
  }

  document.getElementById('btn-load').addEventListener('click', () => {
    status.textContent = '加载中…';
    list.innerHTML = '<div class="sns-empty">加载中…</div>';
    fetch('/api/sns/posts?' + queryParams().toString())
      .then(r => r.json())
      .then(renderPosts)
      .catch(err => {
        list.innerHTML = '<div class="sns-empty">失败：' + esc(err.message) + '</div>';
        status.textContent = '';
      });
  });

  function exportFmt(fmt) {
    status.textContent = '导出中…';
    const body = {
      format: fmt,
      q: document.getElementById('cfg-q').value.trim(),
      username: document.getElementById('cfg-user').value.trim(),
      start: document.getElementById('cfg-start').value,
      end: document.getElementById('cfg-end').value,
      limit: 500,
    };
    fetch('/api/sns/export', {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify(body),
    }).then(async (resp) => {
      if (!resp.ok) throw new Error('HTTP ' + resp.status);
      const reader = resp.body.getReader();
      const decoder = new TextDecoder();
      let buf = '';
      while (true) {
        const {value, done} = await reader.read();
        if (done) break;
        buf += decoder.decode(value, {stream: true});
        const parts = buf.split('\n\n');
        buf = parts.pop() || '';
        for (const chunk of parts) {
          if (chunk.indexOf('event: done') >= 0) {
            const line = chunk.split('\n').find(l => l.startsWith('data: '));
            if (!line) continue;
            const data = JSON.parse(line.slice(6));
            const r = data.result || {};
            if (r.download_url) {
              status.textContent = '导出完成 ' + (r.count || 0) + ' 条';
              window.location.href = r.download_url;
            }
          } else if (chunk.indexOf('event: error') >= 0) {
            const line = chunk.split('\n').find(l => l.startsWith('data: '));
            const data = line ? JSON.parse(line.slice(6)) : {};
            status.textContent = '导出失败：' + (data.message || '未知错误');
          }
        }
      }
    }).catch(err => {
      status.textContent = '导出失败：' + err.message;
    });
  }

  document.getElementById('btn-export-html').addEventListener('click', () => exportFmt('html'));
  document.getElementById('btn-export-json').addEventListener('click', () => exportFmt('json'));

  // status probe then auto-load
  fetch('/api/sns/status').then(r => r.json()).then(s => {
    if (!s.available) {
      status.textContent = s.hint || 'sns.db 不可用';
      list.innerHTML = '<div class="sns-empty">' + esc(s.hint || '请先完成含朋友圈库的备份') + '</div>';
    } else {
      document.getElementById('btn-load').click();
    }
  }).catch(() => {});
})();
</script>
{% endblock %}
